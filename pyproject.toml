[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text2bpmn-mining"
version = "1.0.0"
description = "Khai phá quy trình trên BPMN và nhật ký sự kiện do text2BPMN xuất"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pm4py>=2.7.11,<2.8",
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "lxml>=4.9",
    "scikit-learn>=1.2",
    "scipy>=1.9",
]

[project.scripts]
text2bpmn-mining = "text2bpmn_mining.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
